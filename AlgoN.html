<!DOCTYPE html>

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:13px system-ui,sans-serif}

</style></head><body>

<script>
const $=id=>document.getElementById(id),md=$('md'),f=n=>n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const S={EURUSD:{p:1.1,v:.0004,c:1e5,d:5,sp:.00012,bn:'EURUSDT'},GBPUSD:{p:1.27,v:.0005,c:1e5,d:5,sp:.00018,bn:'GBPUSDT'},XAUUSD:{p:2000,v:.0006,c:100,d:2,sp:.4,bn:'PAXGUSDT'},BTCUSD:{p:60000,v:.0012,c:1,d:2,sp:12,bn:'BTCUSDT'},ETHUSD:{p:2500,v:.0015,c:1,d:2,sp:1,bn:'ETHUSDT'}};
const TF={M1:['1m',6e4],M5:['5m',3e5],M15:['15m',9e5],H1:['1h',36e5],H4:['4h',144e5],D1:['1d',864e5]};
const SAMPLE=`// EA fakkeenyaa (MT5 fakkaata): EMA cross. onTick(c) tick hundaaf waamama.
// c.newBar c.cur c.Bid() c.Ask() c.balance c.equity c.point c.digits
// c.buy(lots,sl,tp) c.sell(..) c.buyStop(lots,price,sl,tp) c.sellStop c.buyLimit c.sellLimit
// c.close(id) c.closeAll() c.modify(id,sl,tp) c.del(id) c.positions() c.orders() c.profit(p)
// c.ema(n,shift) c.sma(n,shift) c.rsi(n,shift) c.atr(n,shift) c.iOpen/iHigh/iLow/iClose(shift)
const Lots=0.1,Fast=10,Slow=30;
function onTick(c){
  if(!c.newBar||c.cur<40)return;
  const f=c.ema(Fast,1),s=c.ema(Slow,1),pf=c.ema(Fast,2),ps=c.ema(Slow,2),a=c.Ask(),b=c.Bid(),r=a*0.004;
  if(pf<=ps&&f>s){c.closeAll();c.buy(Lots,a-r,a+2*r)}
  if(pf>=ps&&f<s){c.closeAll();c.sell(Lots,b+r,b-2*r)}
}`;
const EAS={'EMA Cross (fakkeenya)':SAMPLE};
class Br{constructor(bal,bf,af,now){this.bal=bal;this.P=[];this.O=[];this.H=[];this.bid=bf;this.ask=af;this.now=now;this.id=1e6+Math.floor(Math.random()*9e5);this.lev=100;this.log=()=>{}}
pl(p){return p.dir>0?(this.bid(p.s)-p.px)*p.lots*S[p.s].c:(p.px-this.ask(p.s))*p.lots*S[p.s].c}
eq(){return this.bal+this.P.reduce((s,p)=>s+this.pl(p),0)}
mg(){return this.P.reduce((s,p)=>s+p.lots*S[p.s].c*p.px/this.lev,0)}
free(){return this.eq()-this.mg()}
open(s,dir,lots,sl=0,tp=0,cm=''){const px=dir>0?this.ask(s):this.bid(s);if(lots*S[s].c*px/this.lev>this.free()){this.log('Free margin gahaa miti');return 0}
this.P.push({id:++this.id,t:this.now(),s,dir,lots,px,sl,tp,cm});this.log('#'+this.id+' '+(dir>0?'buy ':'sell ')+lots+' '+s+' @'+px.toFixed(S[s].d));return this.id}
place(s,ty,lots,px,sl=0,tp=0,cm=''){this.O.push({id:++this.id,t:this.now(),s,ty,lots,px,sl,tp,cm});this.log('#'+this.id+' '+ty+' '+lots+' '+s+' @'+px.toFixed(S[s].d));return this.id}
close(id,why='Manual'){const i=this.P.findIndex(p=>p.id==id);if(i<0)return;const p=this.P[i],pr=this.pl(p),xp=p.dir>0?this.bid(p.s):this.ask(p.s);
this.bal+=pr;this.H.unshift({...p,xp,pr,xt:this.now(),why});this.P.splice(i,1);this.log('#'+id+' closed '+f(pr)+' ('+why+')')}
modify(id,sl,tp){const p=this.P.find(p=>p.id==id);if(p){p.sl=sl;p.tp=tp}}
del(id){const i=this.O.findIndex(o=>o.id==id);if(i>=0)this.O.splice(i,1)}
step(s){for(let i=this.O.length-1;i>=0;i--){const o=this.O[i];if(o.s!=s)continue;const b=this.bid(s),a=this.ask(s);
const hit=o.ty=='buyStop'?a>=o.px:o.ty=='buyLimit'?a<=o.px:o.ty=='sellStop'?b<=o.px:b>=o.px;
if(hit){this.O.splice(i,1);this.open(s,o.ty.startsWith('buy')?1:-1,o.lots,o.sl,o.tp,o.cm)}}
for(let i=this.P.length-1;i>=0;i--){const p=this.P[i];if(p.s!=s)continue;const x=p.dir>0?this.bid(s):this.ask(s);
if(p.dir>0?(p.sl&&x<=p.sl)||(p.tp&&x>=p.tp):(p.sl&&x>=p.sl)||(p.tp&&x<=p.tp))this.close(p.id,'SL/TP')}
if(this.P.length&&this.eq()/this.mg()<.3){while(this.P.length)this.close(this.P[0].id,'StopOut')}}}
function api(br,s,bs,cur,nb){bs._c=bs._c||{};const o=S[s],q=k=>bs[cur-k];
const ema=(n,sh=0)=>{const a=2/(n+1),C=bs._c['e'+n]||(bs._c['e'+n]=[]),ix=cur-sh;while(C.length<=Math.min(ix,cur-1))C.push(C.length?bs[C.length].c*a+C[C.length-1]*(1-a):bs[0].c);
return ix>cur-1?bs[ix].c*a+C[ix-1]*(1-a):C[ix]};
return{symbol:s,cur,newBar:!!nb,point:Math.pow(10,-o.d),digits:o.d,balance:br.bal,equity:br.eq(),time:bs[cur].t,
Bid:()=>br.bid(s),Ask:()=>br.ask(s),iOpen:k=>q(k).o,iHigh:k=>q(k).h,iLow:k=>q(k).l,iClose:k=>q(k).c,ema,
sma:(n,sh=0)=>{let t=0;for(let k=0;k<n;k++)t+=q(sh+k).c;return t/n},
rsi:(n,sh=0)=>{let g=0,l=0;for(let k=0;k<n;k++){const d=q(sh+k).c-q(sh+k+1).c;d>0?g+=d:l-=d}return l?100-100/(1+g/l):100},
atr:(n,sh=0)=>{let t=0;for(let k=0;k<n;k++){const b=q(sh+k),pc=q(sh+k+1).c;t+=Math.max(b.h-b.l,Math.abs(b.h-pc),Math.abs(b.l-pc))}return t/n},
buy:(l,sl,tp,cm)=>br.open(s,1,l,sl,tp,cm),sell:(l,sl,tp,cm)=>br.open(s,-1,l,sl,tp,cm),
buyStop:(l,p,sl,tp)=>br.place(s,'buyStop',l,p,sl,tp),sellStop:(l,p,sl,tp)=>br.place(s,'sellStop',l,p,sl,tp),
buyLimit:(l,p,sl,tp)=>br.place(s,'buyLimit',l,p,sl,tp),sellLimit:(l,p,sl,tp)=>br.place(s,'sellLimit',l,p,sl,tp),
close:id=>br.close(id,'EA'),closeAll:()=>br.P.filter(p=>p.s==s).forEach(p=>br.close(p.id,'EA')),modify:(id,sl,tp)=>br.modify(id,sl,tp),del:id=>br.del(id),
delAll:()=>br.O.filter(x=>x.s==s).forEach(x=>br.del(x.id)),positions:()=>br.P.filter(p=>p.s==s),orders:()=>br.O.filter(x=>x.s==s),profit:p=>br.pl(p)}}
const D={};for(const k in S)D[k]={bid:S[k].p,live:0,b:{}};
let sym='EURUSD',tf='M5',auto=false,off=0,bw=7,tk=0,cur=0,ea=null,eaSrc='',eaName='',eaSym='',eaTf='',eaN=0,TR=null,J=[],wsOn=0,wi=0;
const live=new Br(10000,k=>D[k].bid,k=>D[k].bid+S[k].sp,()=>new Date()),ask=k=>D[k].bid+S[k].sp,jl=m=>J.unshift(new Date().toLocaleTimeString()+'  '+m);live.log=jl;
function demoBars(k,t){const o=S[k],ms=TF[t][1];let p=D[k].bid,a=[],T=Date.now()-1000*ms;for(let i=0;i<1000;i++){const op=p,c=op*(1+Math.sin(i/70)*o.v*.05+(Math.random()-.5)*o.v*3);
a.push({t:T+i*ms,o:op,h:Math.max(op,c)*(1+Math.random()*o.v*.6),l:Math.min(op,c)*(1-Math.random()*o.v*.6),c});p=c}D[k].bid=p;return a}
async function ensure(k,t){const d=D[k];if(d.b[t]||d.ld==k+t)return;d.ld=k+t;let j=null;
for(const h of['https://data-api.binance.vision','https://api.binance.com']){try{const r=await fetch(h+'/api/v3/klines?symbol='+S[k].bn+'&interval='+TF[t][0]+'&limit=1000');if(r.ok){j=await r.json();break}}catch(e){}}
if(j){d.b[t]=j.map(x=>({t:x[0],o:+x[1],h:+x[2],l:+x[3],c:+x[4]}));d.bid=d.b[t].at(-1).c;d.live=1;if(!wsOn){wsOn=1;ws()}jl(k+' '+t+': daataa DHUGAA (Binance) fe’ame')}
else{d.b[t]=demoBars(k,t);jl(k+' '+t+': daataa dhugaa hin argamne → DEMO')}}
const WU=['wss://data-stream.binance.vision/stream?streams=','wss://stream.binance.com:9443/stream?streams='];
function ws(){const st=Object.values(S).map(o=>o.bn.toLowerCase()+'@trade').join('/'),w=new WebSocket(WU[wi%2]+st);
w.onmessage=e=>{const x=JSON.parse(e.data).data;if(!x)return;const k=Object.keys(S).find(q=>S[q].bn==x.s);if(k&&D[k].live)D[k].bid=+x.p};
w.onclose=()=>{wi++;setTimeout(ws,2000)}}
function inst(code){try{const E=new Function(code+'\n;return{t:typeof onTick==="function"?onTick:null,i:typeof onInit==="function"?onInit:null}')();if(!E.t)throw Error('onTick(c) hin jiru');return E}catch(e){jl('EA dogoggora: '+e.message);return null}}
function load(code,name){const E=inst(code);if(!E)return;ea=E;eaSrc=code;eaName=name;eaSym=sym;eaTf=tf;const bs=D[sym].b[tf];eaN=bs?bs.length:0;
if(E.i&&bs)try{E.i(api(live,sym,bs,bs.length-1,0))}catch(e){jl('onInit: '+e.message)}jl('EA '+name+' → '+sym+','+tf)}
function runEA(){const bs=D[eaSym].b[eaTf];if(!bs||!ea)return;const nb=bs.length!=eaN;eaN=bs.length;try{ea.t(api(live,eaSym,bs,bs.length-1,nb))}catch(e){jl('EA dogoggora: '+e.message);auto=false}}
function togAuto(){if(!ea){jl('EA dura fe’i');tab(3);return}auto=!auto;jl('AutoTrading '+(auto?'ON':'OFF'))}
$('botf').onchange=e=>{const fl=e.target.files[0];if(!fl)return;if(/\.(mq5|ex5)$/i.test(fl.name)){jl('MQL5/EX5 browser keessatti hin hojjetu. Faayilii .mq5 koo naaf ergi, gara JS nan jijjiira.');tab(3);return}
fl.text().then(x=>{EAS[fl.name]=x;refreshEA();$('eas').value=fl.name;load(x,fl.name)})};
function refreshEA(){$('eas').innerHTML=Object.keys(EAS).map(k=>`<option>${k}</option>`).join('')}
function test(){const k=sym,bs=D[k].b[tf],E=inst(eaSrc);if(!E||!bs){jl('EA fe’ii daataa eeggadhu');tab(3);return}
let px=0,T=0,pk=1e4,dd=0,err=null;const eqs=[],br=new Br(1e4,()=>px,()=>px+S[k].sp,()=>new Date(T));bs._c={};
if(E.i)try{E.i(api(br,k,bs,0,0))}catch(e){err=e}
for(let i=1;i<bs.length&&!err;i++){const o=bs[i];T=o.t;const fb={...o,h:o.o,l:o.o,c:o.o};bs[i]=fb;
const pa=o.c>=o.o?[o.o,o.l,o.h,o.c]:[o.o,o.h,o.l,o.c],pts=[];for(let a=0;a<3;a++)for(let s=a?1:0;s<=3;s++)pts.push(pa[a]+(pa[a+1]-pa[a])*s/3);
for(let j=0;j<pts.length&&!err;j++){px=pts[j];fb.c=px;fb.h=Math.max(fb.h,px);fb.l=Math.min(fb.l,px);br.step(k);try{E.t(api(br,k,bs,i,j==0))}catch(e){err=e}}
bs[i]=o;const e=br.eq();eqs.push(e);pk=Math.max(pk,e);dd=Math.max(dd,(pk-e)/pk)}
br.P.slice().forEach(p=>br.close(p.id,'End'));if(err)jl('Tester dogoggora: '+err.message);
const H=br.H,w=H.filter(x=>x.pr>0),gp=w.reduce((s,x)=>s+x.pr,0),gl=-H.filter(x=>x.pr<=0).reduce((s,x)=>s+x.pr,0),st=Math.ceil(eqs.length/150);
TR={k,tf,n:H.length,net:br.bal-1e4,win:H.length?w.length/H.length*100:0,dd:dd*100,pf:gl?gp/gl:0,bars:bs.length,src:D[k].live?'Dhugaa (Binance)':'DEMO',eq:eqs.filter((_,i)=>i%st==0),H:H.slice(0,25)};tab(2)}
function cash(s){const v=parseFloat($('amt').value);if(!(v>0))return;if(s<0&&v>live.free()){jl('Withdraw: free margin gahaa miti');return}
live.bal+=s*v;live.H.unshift({bal:1,t:new Date(),xt:new Date(),pr:s*v,why:s>0?'Deposit':'Withdraw'});jl((s>0?'Deposit ':'Withdraw ')+f(v));$('amt').value='';md.classList.add('hide')}
function ord(dir){const k=sym,px=dir>0?ask(k):D[k].bid,l=+$('lot').value||.1,s=+$('slp').value/100,t=+$('tpp').value/100,ty=$('otype').value;
if(ty=='Market'){live.open(k,dir,l,s?px*(1-dir*s):0,t?px*(1+dir*t):0);return}
let p=+$('opx').value;if(!p)p=px*(1+dir*(ty=='Stop'?1:-1)*.001);live.place(k,(dir>0?'buy':'sell')+ty,l,p,s?p*(1-dir*s):0,t?p*(1+dir*t):0)}
function tick(){tk++;for(const k in S){const d=D[k];if(!d.live)d.bid*=1+(Math.random()-.5)*S[k].v*.5;
for(const t in d.b){const bs=d.b[t],b=bs.at(-1),ms=TF[t][1];if(d.live?Date.now()>=b.t+ms:tk%25==0)bs.push({t:b.t+ms,o:d.bid,h:d.bid,l:d.bid,c:d.bid});
const n=bs.at(-1);n.c=d.bid;n.h=Math.max(n.h,d.bid);n.l=Math.min(n.l,d.bid)}live.step(k)}
if(auto&&ea)runEA();ui();draw()}
function sel(k){sym=k;off=0;ensure(k,tf)}
function setTf(t){tf=t;off=0;ensure(sym,t)}
function tab(n){cur=n;document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('on',i==n));ui()}
function ui(){const rd=k=>D[k].b[tf]?D[k].bid.toFixed(S[k].d):'…';
$('mw').innerHTML=Object.keys(S).map(k=>`<div class="ch ${k==sym?'on':''}" onpointerdown="sel('${k}')"><b>${k}</b><span class="dn">${rd(k)}</span><span class="up2">${D[k].b[tf]?ask(k).toFixed(S[k].d):''}</span></div>`).join('');
$('tf').innerHTML=Object.keys(TF).map(t=>`<button class="${t==tf?'on':''}" onpointerdown="setTf('${t}')">${t}</button>`).join('');
const bn=$('ban'),dm=D[sym].b[tf]&&!D[sym].live;bn.classList.toggle('hide',!dm);if(dm)bn.textContent='○ DEMO: daataa dhugaa hin argamne. Faayilii kana GitHub Pages irratti bani (preview keessatti network cufameera).';
$('sb').textContent=D[sym].bid.toFixed(S[sym].d);$('bb').textContent=ask(sym).toFixed(S[sym].d);
$('au').className=auto?'on':'';$('au').textContent='AutoTrading '+(auto?'ON':'OFF');
$('eal').textContent=ea?(auto?'▶ ':'⏸ ')+eaName+' → '+eaSym+','+eaTf:'EA hin fe’amne';
const e=live.eq(),m=live.mg();$('acc').innerHTML=`Balance: <b>${f(live.bal)}</b> Equity: <b>${f(e)}</b> Margin: <b>${f(m)}</b> Free: <b>${f(e-m)}</b> Level: <b>${m?(e/m*100).toFixed(0)+'%':'-'}</b>`;
const d=p=>S[p.s].d,x=(v,p)=>v?v.toFixed(d(p)):'';let h='';

live.P.map(p=>`<tr><td>${p.id}</td><td>${p.t.toLocaleTimeString()}</td><td class="${p.dir>0?'up':'dn'}">${p.dir>0?'buy':'sell'}</td><td>${p.lots}</td><td>${p.s}</td><td>${p.px.toFixed(d(p))}</td><td>${x(p.sl,p)}</td><td>${x(p.tp,p)}</td><td>${(p.dir>0?D[p.s].bid:ask(p.s)).toFixed(d(p))}</td><td class="${live.pl(p)>=0?'up':'dn'}">${f(live.pl(p))}</td><td><button onpointerdown="live.close(${p.id})">✕</button></td></tr>`).join('')+
